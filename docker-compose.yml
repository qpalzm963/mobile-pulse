services:
  mobile-pulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: mobile-pulse:latest
    container_name: mobile-pulse
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_FILE=/app/data/mobile-pulse.sqlite
      - PAYLOAD_DATABASE_FILE=/app/data/cms.sqlite
      - MEDIA_DIR=/app/media
    volumes:
      # 持久化儲存：SQLite 資料庫與 Media 媒體檔案存放在主機目錄中
      - ./data:/app/data
      - ./media:/app/media
