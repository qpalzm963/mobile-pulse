<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AI 輔助 App 開發的可驗證工作流</title>
  <desc id="desc">從任務規格、AI 協作、驗證關卡到發布的四步流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b35"/><stop offset="1" stop-color="#142e5b"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#38d6ff"/><stop offset="1" stop-color="#8976ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <text x="60" y="70" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">把 AI 放進「可驗證」的 App 開發流程</text>
  <text x="60" y="103" fill="#b5c8e9" font-family="Arial, sans-serif" font-size="18">關鍵不在產碼速度，而是每一步都能被團隊檢查與重複執行。</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="60" y="165" width="230" height="155" rx="22" fill="#fff"/>
    <circle cx="100" cy="208" r="22" fill="#e4f8ff"/><text x="92" y="216" fill="#167499" font-size="22" font-weight="700">1</text>
    <text x="135" y="207" fill="#132846" font-size="22" font-weight="700">任務規格</text>
    <text x="92" y="255" fill="#50627a" font-size="17">定義輸入、限制與</text><text x="92" y="280" fill="#50627a" font-size="17">可驗收的完成條件</text>
    <rect x="355" y="165" width="230" height="155" rx="22" fill="#fff"/>
    <circle cx="395" cy="208" r="22" fill="#f0edff"/><text x="387" y="216" fill="#6652c8" font-size="22" font-weight="700">2</text>
    <text x="430" y="207" fill="#132846" font-size="22" font-weight="700">AI 協作</text>
    <text x="387" y="255" fill="#50627a" font-size="17">依 Skill 執行設計、</text><text x="387" y="280" fill="#50627a" font-size="17">程式、遷移或測試</text>
    <rect x="650" y="165" width="230" height="155" rx="22" fill="#fff"/>
    <circle cx="690" cy="208" r="22" fill="#e8fff4"/><text x="682" y="216" fill="#18875c" font-size="22" font-weight="700">3</text>
    <text x="725" y="207" fill="#132846" font-size="22" font-weight="700">驗證關卡</text>
    <text x="682" y="255" fill="#50627a" font-size="17">單元測試、真機測試、</text><text x="682" y="280" fill="#50627a" font-size="17">Code Review</text>
    <rect x="945" y="165" width="195" height="155" rx="22" fill="#fff"/>
    <circle cx="985" cy="208" r="22" fill="#fff3e4"/><text x="977" y="216" fill="#c36a11" font-size="22" font-weight="700">4</text>
    <text x="1020" y="207" fill="#132846" font-size="22" font-weight="700">發布</text>
    <text x="977" y="255" fill="#50627a" font-size="17">CI、商店與</text><text x="977" y="280" fill="#50627a" font-size="17">監測流程</text>
  </g>
  <g stroke="url(#accent)" stroke-width="6" fill="none"><path d="M300 243h42"/><path d="M595 243h42"/><path d="M890 243h42"/></g>
  <g fill="#55d8ff"><path d="M340 232l18 11-18 11z"/><path d="M635 232l18 11-18 11z"/><path d="M930 232l18 11-18 11z"/></g>
</svg>
