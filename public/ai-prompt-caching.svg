<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Caching 快取命中與成本斷崖機制</title>
  <desc id="desc">靜態上下文快取命中後，延遲與 Token 成本大幅降低。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b132b"/><stop offset="1" stop-color="#1c2541"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <text x="60" y="65" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Prompt Caching：長上下文成本斷崖的技術核心</text>
  <text x="60" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">將不變的系統規範與大型 Codebase 前綴固化在記憶體，大幅壓低重複運算。</text>
  
  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- First call (Cold) -->
    <rect x="60" y="145" width="510" height="215" rx="18" fill="#ffffff"/>
    <rect x="60" y="145" width="510" height="40" rx="18" fill="#f1f5f9"/>
    <text x="85" y="172" fill="#0f172a" font-size="16" font-weight="700">首次呼叫（Cold Start 未命中）</text>
    <rect x="85" y="205" width="460" height="45" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="105" y="233" fill="#991b1b" font-size="15" font-weight="600">全量 Context (100k+ Tokens) 全新計算</text>
    <rect x="85" y="260" width="460" height="35" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="105" y="283" fill="#475569" font-size="14">全額 Token 費率 · 首字延遲 (TTFT) 較長 (~3-5s)</text>
    <rect x="85" y="305" width="130" height="32" rx="6" fill="#ef4444"/><text x="102" y="326" fill="#ffffff" font-size="13" font-weight="700">100% 原始成本</text>

    <!-- Subsequent calls (Warm / Cached) -->
    <rect x="630" y="145" width="510" height="215" rx="18" fill="#ffffff"/>
    <rect x="630" y="145" width="510" height="40" rx="18" fill="#eff6ff"/>
    <text x="655" y="172" fill="#1d4ed8" font-size="16" font-weight="700">後續呼叫（Cache Hit 命中快取）</text>
    <rect x="655" y="205" width="340" height="45" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="675" y="233" fill="#1e40af" font-size="15" font-weight="600">⚡ 快取命中：前綴直接讀取 KV-Cache</text>
    <rect x="1005" y="205" width="110" height="45" rx="8" fill="#fef3c7" stroke="#fde68a"/>
    <text x="1020" y="233" fill="#92400e" font-size="14" font-weight="600">增量查詢</text>
    <rect x="655" y="260" width="460" height="35" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="675" y="283" fill="#166534" font-size="14">Token 費率折抵 80%~90% · 首字延遲降至毫秒級</text>
    <rect x="655" y="305" width="160" height="32" rx="6" fill="#10b981"/><text x="672" y="326" fill="#ffffff" font-size="13" font-weight="700">節省 80%~90% 費用</text>
  </g>
</svg>
