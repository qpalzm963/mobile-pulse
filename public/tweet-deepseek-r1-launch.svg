<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- 外層背景卡片 -->
  <rect x="10" y="10" width="600" height="280" rx="16" fill="#ffffff" stroke="#e1e8ed" stroke-width="1.2" filter="url(#card-shadow)" />

  <!-- 頭像 -->
  <g>
    <circle cx="48" cy="48" r="24" fill="#0284c7" />
    <text x="48" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">DS</text>
  </g>

  <!-- 作者資訊 -->
  <text x="84" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f1419">DeepSeek</text>
  
  <!-- 認證標記 -->
  <g transform="translate(164, 31)">
    <circle cx="8" cy="8" r="8" fill="#1d9bf0" />
    <path d="M5 8.2l2.2 2.2 4.4-4.4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="84" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#536471">@deepseek_ai</text>

  <!-- X Logo -->
  <path d="M575 32l-10.4 12.3L576 60h-2.5l-9.1-12.4-7.5 12.4h-6.8l11.1-13.2L551 32h2.5l8.4 11.5 6.9-11.5h6.2zm-3.6 26.2h1.6L556.1 33.6h-1.7l17 24.6z" fill="#0f1419" />

  <!-- 推文主體 -->
  <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" fill="#0f1419">
    <tspan x="24" dy="0">Today, we are thrilled to introduce DeepSeek-R1!</tspan>
    <tspan x="24" dy="24">DeepSeek-R1 achieves performance comparable to OpenAI-o1 across math,</tspan>
    <tspan x="24" dy="24">code, and reasoning tasks.</tspan>
    <tspan x="24" dy="28" font-weight="600" fill="#0284c7">We open-source DeepSeek-R1-Zero, DeepSeek-R1, and 6 dense models</tspan>
    <tspan x="24" dy="24" font-weight="600" fill="#0284c7">distilled from Llama and Qwen for the global community. 🚀</tspan>
  </text>

  <!-- 分隔線 -->
  <line x1="24" y1="235" x2="596" y2="235" stroke="#eff3f4" stroke-width="1" />

  <!-- 底部數據資訊 -->
  <text x="24" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#536471">
    <tspan fill="#536471">Jan 20, 2025</tspan>
    <tspan dx="16" fill="#536471">💬 3.8K</tspan>
    <tspan dx="16" fill="#536471">🔄 18.2K</tspan>
    <tspan dx="16" fill="#536471">🤍 64.5K</tspan>
    <tspan dx="16" fill="#536471">📊 12.8M</tspan>
  </text>
</svg>
